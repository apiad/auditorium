<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; }
  #slide-root { position: relative; width: 800px; height: 600px; }
  #slide-root > div { position: absolute; top: 100px; left: 50px; }
  /* The overlay maps 1:1 to viewport pixels: no viewBox, no transform.
     Anything else would mean transforming getBoundingClientRect values
     into SVG user units, which is exactly the layout modelling D6 keeps
     out of the codebase. */
  #svg-layer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    overflow: visible;
  }
</style>
</head>
<body>
  <div id="slide-root"></div>
  <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="aud-arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
      </marker>
    </defs>
  </svg>
  <script type="module">
/*ENGINE*/
  </script>
</body>
</html>
