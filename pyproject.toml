[project]
name = "auditorium"
version = "1!3.6.0"
description = "Python-scripted live slide framework"
authors = [{name = "Alejandro Piad", email = "apiad@apiad.net"}]
license = {text = "MIT"}
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "markdown>=3.6",
    "rich>=15.0.0",
]

[project.scripts]
auditorium = "auditorium.cli:app"

[project.optional-dependencies]
record = [
    "playwright>=1.62",
    "tqdm>=4.67.3",
]
examples = [
    "tesserax>=0.11",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "tesserax>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditorium"]

[tool.hatch.build.targets.sdist]
include = [
    "/auditorium",
]

[dependency-groups]
dev = [
    "playwright>=1.62",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
