<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditorium – Presenter</title>

    <!-- All assets are local — no outbound requests -->
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/static/vendor/hljs/styles/github.min.css">
    <script src="/static/vendor/katex/katex.min.js"></script>
    <script src="/static/vendor/katex/contrib/auto-render.min.js"></script>
    <script src="/static/vendor/hljs/highlight.min.js"></script>
    <!--AUDITORIUM_THEME_OVERRIDES-->
    <link rel="stylesheet" href="/static/presenter.css">
</head>
<body class="aud-presenter">
    <div id="presenter-container">
        <!-- Left: a real engine over the real timeline, scaled to fit.
             Not a copy of the audience's DOM: two engines seeking one
             timeline agree by construction (D2), whereas a mirror is a
             second path that can disagree with the first. -->
        <div id="slide-pane">
            <div id="presenter-stage">
                <div id="slide-root" class="aud-slide-root"></div>
                <div class="aud-chrome aud-chrome-header"></div>
                <div class="aud-chrome aud-chrome-footer"></div>
                <div class="aud-chrome aud-chrome-left"></div>
                <div class="aud-chrome aud-chrome-right"></div>
            </div>
        </div>

        <div id="info-pane">
            <div id="notes">No notes.</div>

            <div id="next-preview">
                <div id="next-title">Next: —</div>
                <div id="next-excerpt"></div>
            </div>

            <div id="presenter-footer">
                <span id="presenter-timer">00:00</span>
                <span id="slide-indicator"></span>
            </div>
        </div>
    </div>

    <div id="connection-status"></div>

    <script type="module">
    import { AuditoriumEngine } from "/static/engine.js";
    import { connect, createPlayer, installDecoration } from "/static/client.js";
    window.AuditoriumEngine = AuditoriumEngine;

    const stage = document.getElementById('presenter-stage');
    const pane = document.getElementById('slide-pane');
    const indicator = document.getElementById('slide-indicator');
    const statusEl = document.getElementById('connection-status');
    const notesEl = document.getElementById('notes');
    const nextTitleEl = document.getElementById('next-title');
    const nextExcerptEl = document.getElementById('next-excerpt');
    const timerEl = document.getElementById('presenter-timer');

    let timerStart = null;
    let timerInterval = null;
    let socket = null;

    installDecoration(AuditoriumEngine);

    /** Plain text of author-authored HTML, for the next-scene excerpt.
     *  Via textContent, never a regex: notes are real markup. */
    function excerptOf(html, limit = 200) {
        const box = document.createElement('div');
        box.innerHTML = html || '';
        const text = box.textContent.trim().replace(/\s+/g, ' ');
        return text.length > limit ? text.slice(0, limit) + '…' : text;
    }

    const player = createPlayer({
        engine: AuditoriumEngine,
        onFrame(p) {
            const t = p.t;
            indicator.textContent = (p.beatIndex(t) + 1) + ' / ' + (p.beats.length + 1);

            const here = p.markerAt(t);
            notesEl.innerHTML =
                here && here.notes_html && here.notes_html.trim()
                    ? here.notes_html
                    : 'No notes.';

            const next = p.markerAfter(t);
            if (next) {
                nextTitleEl.textContent = 'Next: ' + next.title;
                nextExcerptEl.textContent = excerptOf(next.notes_html);
            } else {
                nextTitleEl.textContent = 'Last scene';
                nextExcerptEl.textContent = '';
            }
        },
    });

    function fitStage() {
        const w = pane.clientWidth;
        const h = pane.clientHeight;
        const scale = Math.min(w / 1920, h / 1080);
        // Translate before scale in the composite, so the offsets are in the
        // pane's own pixels and the letterboxing is even on both sides.
        const dx = (w - 1920 * scale) / 2;
        const dy = (h - 1080 * scale) / 2;
        stage.style.transform =
            'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
    }

    function startTimer() {
        if (timerStart !== null) return;
        timerStart = Date.now();
        timerInterval = setInterval(function () {
            const elapsed = Math.floor((Date.now() - timerStart) / 1000);
            const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const ss = String(elapsed % 60).padStart(2, '0');
            timerEl.textContent = mm + ':' + ss;
        }, 1000);
    }

    function send(cmd) {
        if (socket) socket.send(Object.assign({ type: 'cmd' }, cmd));
    }

    // Act locally, then broadcast the same intent. The audience runs the same
    // engine over the same timeline, so a command is enough -- there is no
    // need to stream 60 positions a second, and nothing to drift.
    function next() {
        startTimer();
        const from = player.t;
        const to = player.nextBeat(from);
        if (player.playing) { player.seekTo(to); send({ cmd: 'seek', t: to }); }
        else { player.playTo(to); send({ cmd: 'playTo', from, to }); }
    }

    function prev() {
        startTimer();
        const to = player.prevBeat(player.t);
        player.seekTo(to);
        send({ cmd: 'seek', t: to });
    }

    function seekTo(t) {
        player.seekTo(t);
        send({ cmd: 'seek', t });
    }

    document.addEventListener('keydown', function (e) {
        switch (e.key) {
            case ' ':
            case 'ArrowRight':
            case 'PageDown':
                e.preventDefault(); next(); break;
            case 'ArrowLeft':
            case 'PageUp':
                e.preventDefault(); prev(); break;
            case 'r': e.preventDefault(); seekTo(0); break;
            case 'End': e.preventDefault(); seekTo(player.duration); break;
        }
    });

    window.addEventListener('resize', fitStage);

    window.__auditorium_presenter = {
        next, prev, seekTo,
        state: () => ({
            t: player.t,
            timerRunning: timerStart !== null,
            notes: notesEl.innerHTML,
        }),
    };

    socket = connect({
        role: 'presenter',
        onStatus(state) {
            statusEl.innerHTML = '<span class="aud-dot aud-dot-' + state + '"></span>';
        },
        async onReload() {
            const held = player.t;
            await player.fetchAndLoad();
            player.seekTo(Math.min(held, player.duration));
        },
    });

    (async function () {
        await player.fetchAndLoad();
        fitStage();
        player.seekTo(0);
    })();
    </script>
</body>
</html>
