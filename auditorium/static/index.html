<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditorium</title>

    <!-- All assets are local — no outbound requests -->
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/static/vendor/hljs/styles/github.min.css">
    <script src="/static/vendor/katex/katex.min.js"></script>
    <script src="/static/vendor/katex/contrib/auto-render.min.js"></script>
    <script src="/static/vendor/hljs/highlight.min.js"></script>
    <!--AUDITORIUM_THEME_OVERRIDES-->
</head>
<body>
    <div id="slide-root"></div>

    <!-- Theme chrome slots. Empty by default; themes fill via ::before/::after. -->
    <div class="aud-chrome aud-chrome-header"></div>
    <div class="aud-chrome aud-chrome-footer"></div>
    <div class="aud-chrome aud-chrome-left"></div>
    <div class="aud-chrome aud-chrome-right"></div>

    <div id="slide-indicator"></div>
    <div id="connection-status"></div>

    <script type="module">
    import { AuditoriumEngine } from "/static/engine.js";
    window.AuditoriumEngine = AuditoriumEngine;

    const root = document.getElementById('slide-root');
    const indicator = document.getElementById('slide-indicator');
    const statusEl = document.getElementById('connection-status');

    let beats = [];
    let duration = 0;
    let playing = false;
    let clockBase = 0;
    let clockStart = 0;

    function setStatus(state) {
        statusEl.innerHTML = '<span class="aud-dot aud-dot-' + state + '"></span>';
    }

    // KaTeX and highlight.js. Registered as an append hook rather than run per
    // frame: both mutate innerHTML, so re-running them on every seek would
    // re-highlight already-marked code and cost time in the render loop.
    AuditoriumEngine.onAppend = function (el) {
        if (typeof renderMathInElement === 'function') {
            renderMathInElement(el, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                ],
                throwOnError: false,
            });
        }
        if (typeof hljs !== 'undefined') {
            el.querySelectorAll('pre code').forEach(function (block) {
                hljs.highlightElement(block);
            });
        }
    };

    function beatIndex(t) {
        let i = 0;
        for (const b of beats) if (b < t) i += 1;
        return i;
    }

    function updateChrome() {
        const t = AuditoriumEngine.currentTime;
        const n = beatIndex(t) + 1;
        const total = beats.length + 1;
        if (indicator) indicator.textContent = n + ' / ' + total;
        const style = document.documentElement.style;
        style.setProperty('--aud-slide-number', n);
        style.setProperty('--aud-slide-total', total);
    }

    function nextBeat(from) {
        for (const b of beats) if (b > from) return b;
        return duration;
    }

    function prevBeat(from) {
        let target = 0;
        for (const b of beats) if (b < from - 1) target = b;
        return target;
    }

    function seekTo(t) {
        playing = false;
        AuditoriumEngine.seek(t);
        updateChrome();
    }

    function playTo(target) {
        playing = true;
        clockBase = AuditoriumEngine.currentTime;
        clockStart = performance.now();
        function frame(now) {
            if (!playing) return;
            const t = Math.min(clockBase + (now - clockStart), target);
            AuditoriumEngine.seek(t);
            updateChrome();
            if (t < target) requestAnimationFrame(frame);
            else playing = false;
        }
        requestAnimationFrame(frame);
    }

    async function loadTimeline() {
        const tl = await (await fetch('/timeline.json')).json();
        beats = (tl.beats || []).map(function (b) { return b.t; });
        duration = (tl.meta && tl.meta.duration_ms) || 0;
        AuditoriumEngine.load(tl);
        AuditoriumEngine.seek(0);
        updateChrome();
        window.__auditorium_ready = true;
        playTo(nextBeat(0));
    }

    document.addEventListener('keydown', function (e) {
        const t = AuditoriumEngine.currentTime;
        if (e.key === ' ' || e.key === 'ArrowRight') {
            e.preventDefault();
            if (playing) seekTo(nextBeat(t));
            else playTo(nextBeat(t));
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            seekTo(prevBeat(t));
        } else if (e.key === 'r') {
            e.preventDefault();
            seekTo(0);
        } else if (e.key === 'End') {
            e.preventDefault();
            seekTo(duration);
        }
    });

    function connect() {
        setStatus('connecting');
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsMeta = document.querySelector('meta[name="auditorium-ws-path"]');
        const wsPath = wsMeta ? wsMeta.content : '/ws';
        const ws = new WebSocket(protocol + '//' + location.host + wsPath);
        ws.onopen = function () {
            setStatus('connected');
            ws.send(JSON.stringify({ type: 'hello', role: 'audience' }));
        };
        ws.onmessage = function (event) {
            if (JSON.parse(event.data).type === 'reload') loadTimeline();
        };
        ws.onclose = function () {
            setStatus('disconnected');
            setTimeout(connect, 1000);
        };
        ws.onerror = function () { ws.close(); };
    }

    connect();
    loadTimeline();
    </script>
</body>
</html>
