<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditorium</title>

    <!-- All assets are local — no outbound requests -->
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/static/vendor/hljs/styles/github.min.css">
    <script src="/static/vendor/katex/katex.min.js"></script>
    <script src="/static/vendor/katex/contrib/auto-render.min.js"></script>
    <script src="/static/vendor/hljs/highlight.min.js"></script>
    <link rel="stylesheet" href="/static/svg-layer.css">
    <!--AUDITORIUM_MODE-->
    <!--AUDITORIUM_THEME_OVERRIDES-->
</head>
<body>
    <div id="slide-root" class="aud-slide-root"></div>

    <!-- Theme chrome slots. Empty by default; themes fill via ::before/::after. -->
    <div class="aud-chrome aud-chrome-header"></div>
    <div class="aud-chrome aud-chrome-footer"></div>
    <div class="aud-chrome aud-chrome-left"></div>
    <div class="aud-chrome aud-chrome-right"></div>

    <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="aud-arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
        </marker>
      </defs>
    </svg>

    <div id="slide-indicator"></div>
    <div id="connection-status"></div>

    <script type="module">
    import { AuditoriumEngine } from "/static/engine.js";
    import { connect, createPlayer, installDecoration } from "/static/client.js";
    window.AuditoriumEngine = AuditoriumEngine;

    const indicator = document.getElementById('slide-indicator');
    const statusEl = document.getElementById('connection-status');

    // Injected by the server into the shell, so it is known before the first
    // frame. In presenter mode the audience is driven: its keyboard is inert
    // (otherwise any tab in the room could navigate the talk) and it does not
    // autoplay, because a presenter starting at zero and an audience playing
    // itself to the first beat are out of step from the very first keypress.
    const modeMeta = document.querySelector('meta[name="auditorium-presenter-mode"]');
    const presenterMode = !!modeMeta && modeMeta.content === 'true';

    installDecoration(AuditoriumEngine);

    const player = createPlayer({
        engine: AuditoriumEngine,
        onFrame(p) {
            const n = p.beatIndex(p.t) + 1;
            const total = p.beats.length + 1;
            if (indicator) indicator.textContent = n + ' / ' + total;
            const style = document.documentElement.style;
            style.setProperty('--aud-slide-number', n);
            style.setProperty('--aud-slide-total', total);
        },
    });
    window.__auditorium_player = player;

    document.addEventListener('keydown', function (e) {
        if (presenterMode) return;
        const t = player.t;
        if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') {
            // PageDown/PageUp because that is what a presentation clicker
            // sends; they mean the same thing as the arrows here.
            e.preventDefault();
            if (player.playing) player.seekTo(player.nextBeat(t));
            else player.playTo(player.nextBeat(t));
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            player.seekTo(player.prevBeat(t));
        } else if (e.key === 'r') {
            e.preventDefault();
            player.seekTo(0);
        } else if (e.key === 'End') {
            e.preventDefault();
            player.seekTo(player.duration);
        }
    });

    connect({
        role: 'audience',
        onStatus(state) {
            statusEl.innerHTML = '<span class="aud-dot aud-dot-' + state + '"></span>';
        },
        async onReload() {
            const held = player.t;
            await player.fetchAndLoad();
            if (presenterMode) player.seekTo(Math.min(held, player.duration));
            else player.playTo(player.nextBeat(0));
        },
        // The presenter broadcasts intent, not positions: every surface runs
        // the same deterministic engine over the same timeline, so a command
        // is enough and 60 messages a second are not.
        onCommand(msg) {
            if (msg.cmd === 'seek') player.seekTo(msg.t);
            else if (msg.cmd === 'playTo') { player.seekTo(msg.from); player.playTo(msg.to); }
        },
    });

    (async function () {
        await player.fetchAndLoad();
        // Driven surfaces wait to be driven; independent ones start themselves.
        if (!presenterMode) player.playTo(player.nextBeat(0));
    })();
    </script>
</body>
</html>
